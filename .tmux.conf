#############################################################
##
## tmux configuration
## plugins are at the bottom
##
#############################################################

# The default prefix key is hard to reach. Go with C-v
unbind C-b
set -g prefix C-v

# resource config
bind-key R source-file ~/.tmux.conf \; refresh-client -S \; display-message -d 500 "Sourced config file ~/.tmux.conf"

# set-window-option -g mode-keys emacs

# This allows tmux to set your system clipboard without external tools
set -s set-clipboard on

# set default name for new windows
unbind c
bind-key c new-window -n "new"

unbind %
bind-key s set -g synchronize-panes


# when a window closes, renumber what's left to the lowest available index
set-option -g renumber-windows on

# if this is on we get to use the scroll wheel but selecting uses the tmux
# paste buffer. I think I prefer mouse selecting copy/paste to mouse scrolling
# Use prefix-pgup
#set -g mode-mouse off
# Mouse support
set -g mouse on    # Enable mouse mode

# keeps commands from running and clobbering window name
set-window-option -g automatic-rename off

bind b run "open $(tmux save-buffer -)"

# Display the pane numbers upto 10s
set -g display-panes-time 10000

# set -g status-bg black
# set -g status-fg white
# set -g status-interval 30
# set -g status-left-length 30
# set -g status-left '     '
# #set -g status-right '#(cut -d " " -f 1-3 /proc/loadavg) %Y-%m-%d %H:%M'
# set -g status-right '%Y-%m-%d %H:%M'
# set-window-option -g window-status-current-bg white
# set-window-option -g window-status-current-fg black

set -g allow-passthrough on



#############################################################
##
## Plugins
##
#############################################################

# plugin options

# https://github.com/tmux-plugins/tmux-continuum
# tmux session saving and auto restore
set -g @continuum-restore 'on'
# autostart tmux on boot for OSX
# https://github.com/tmux-plugins/tmux-continuum/blob/master/docs/automatic_start.md
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'iterm'


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # https://github.com/tmux-plugins/tmux-sensible
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum' # https://github.com/tmux-plugins/tmux-continuum
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'omerxx/tmux-floax'


set -g @plugin 'alberti42/tmux-fzf-url'
set -g @fzf-url-bind 'u'

# Auto-detect macOS dark/light mode and set catppuccin flavor accordingly.
# If @catppuccin_flavor_override is set (by prefix+T toggle), use that instead.
# Only clears and regenerates theme variables when the flavor actually changes.
run-shell '
  override=$(tmux show -gv @catppuccin_flavor_override 2>/dev/null)
  current=$(tmux show -gv @catppuccin_flavor 2>/dev/null)
  if [ -n "$override" ]; then
    desired="$override"
  elif [ "$(osascript -e "tell application \"System Events\" to tell appearance preferences to get dark mode" 2>/dev/null)" = "true" ]; then
    desired="mocha"
  else
    desired="latte"
  fi
  if [ "$current" != "$desired" ] || [ -z "$(tmux show -gv @thm_bg 2>/dev/null)" ]; then
    for key in $(tmux show -g 2>/dev/null | grep -E "^@(thm_|catppuccin_)" | cut -d" " -f1); do
      tmux set -gu "$key"
    done
    tmux set -g @catppuccin_flavor "$desired"
    if [ -n "$override" ]; then
      tmux set -g @catppuccin_flavor_override "$override"
    fi
  fi
'

# prefix+T to toggle catppuccin between light/dark (latte/mocha)
bind-key T run-shell '
  current=$(tmux show -gv @catppuccin_flavor 2>/dev/null)
  if [ "$current" = "latte" ]; then
    next="mocha"
  else
    next="latte"
  fi
  tmux set -g @catppuccin_flavor_override "$next"
  tmux source-file ~/.tmux.conf
  tmux set -gu @catppuccin_flavor_override
'

# catppuccin theme config (must be after the clear above, before the plugin loads)
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"

set -g @plugin 'catppuccin/tmux'

# Initialize TMUX plugin manager (keep this line after all @plugin calls)
run '~/.tmux/plugins/tpm/tpm'

# Clear legacy status-bg/fg that override catppuccin's status-style
set -gu status-bg
set -gu status-fg

# Status line (must come after catppuccin modules are generated)
set -g status-interval 10
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#[default] #(tmux-ai-status) "
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
# Required for tmux-continuum auto-save. It hooks into status-right to trigger periodic saves.
set -ag status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"

#highlight active pane
set -g pane-border-style "fg=#{@thm_surface_1},bg=#{@thm_surface_1}"
set -g pane-active-border-style "fg=#{@thm_fg},bg=#{@thm_overlay_0},bold"

set -g pane-border-status top      # or 'bottom'
set -g pane-border-format "| #{pane_title} |" # can also use #{pane_index}


# bind , already bound to rename window
bind . command-prompt -p "(rename-pane)" -I "#T" "select-pane -T '%%'"
bind M-. command-prompt -p "(rename-session)" -I "#S" "rename-session '%%'"

bind M-, switch-client -l

# bring marked pane next to the current one
bind-key M-j join-pane -h

# bring the marked pane below the current one
bind-key M-J join-pane -v

# Set the command run in new windows/panes
set-option -g default-shell /bin/zsh
set-option -g default-command "/bin/zsh"

# We unbind the default first to be safe
unbind -T copy-mode M-w
bind-key -T copy-mode C-space send-keys -X begin-selection
bind-key -T copy-mode y send-keys -X copy-selection-and-cancel

# These keys are mapped to a keyboard shortcut in iTerm which sends the hex code of the key chord for these commands.
# This allows for mapping commands to single key bindings like Command+K.
# These are defined at the bottom so that they override any key bindings from other plugins.

#Command+k 0x16 0x4B
bind-key "K" display-popup -E  -w 40% "sesh connect \"$(sesh list -i | tv --ansi --input-header "Sessions" | awk '{print \$NF}')\""

# Use the default Mac OS handler to open a given file.!!!
#Command+p 0x16 0x50
bind-key "P" display-popup -E  -w 80% -d '#{pane_current_path}' "result=\$(tv --ansi --input-header 'Files' files | awk '{print \$NF}') && [ -n \"\$result\" ] && open \"\$result\""
