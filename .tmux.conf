#############################################################
##
## tmux configuration
## plugins are at the bottom
##
#############################################################

# The default prefix key is hard to reach. Go with C-v
unbind C-b
set -g prefix C-v

# resource config
bind-key R source-file ~/.tmux.conf \; refresh-client -S \; display-message "Sourced config file ~/.tmux.conf"

# set-window-option -g mode-keys emacs

# This allows tmux to set your system clipboard without external tools
set -s set-clipboard on

# set default name for new windows
unbind c
bind-key c new-window -n "new"

unbind %
bind-key s set -g synchronize-panes


# when a window closes, renumber what's left to the lowest available index
set-option -g renumber-windows on

# if this is on we get to use the scroll wheel but selecting uses the tmux
# paste buffer. I think I prefer mouse selecting copy/paste to mouse scrolling
# Use prefix-pgup
#set -g mode-mouse off
# Mouse support
set -g mouse on    # Enable mouse mode

# keeps commands from running and clobbering window name
set-window-option -g automatic-rename off

bind b run "open $(tmux save-buffer -)"

# Display the pane numbers upto 10s
set -g display-panes-time 10000

# set -g status-bg black
# set -g status-fg white
# set -g status-interval 30
# set -g status-left-length 30
# set -g status-left '     '
# #set -g status-right '#(cut -d " " -f 1-3 /proc/loadavg) %Y-%m-%d %H:%M'
# set -g status-right '%Y-%m-%d %H:%M'
# set-window-option -g window-status-current-bg white
# set-window-option -g window-status-current-fg black

#highlight active pane
set -g pane-border-style bg=black,fg=white
set -g pane-active-border-style bg=blue,fg=white
set -g allow-passthrough on


# catppuccin theme config (options must be set before the plugin is loaded)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"

#############################################################
##
## Plugins
##
#############################################################

# plugin options

# https://github.com/tmux-plugins/tmux-continuum
# tmux session saving and auto restore
set -g @continuum-restore 'on'
# autostart tmux on boot for OSX
# https://github.com/tmux-plugins/tmux-continuum/blob/master/docs/automatic_start.md
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'iterm'


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # https://github.com/tmux-plugins/tmux-sensible
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum' # https://github.com/tmux-plugins/tmux-continuum
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'catppuccin/tmux'

set -g @plugin 'alberti42/tmux-fzf-url'
set -g @fzf-url-bind 'u'

# no longer needed after tmux 3.1
#set -g @plugin 'tmux-plugins/tmux-yank'

# Load catppuccin before setting status line (required for module interpolation)
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Status line (must come after catppuccin is loaded)
set -g status-interval 10
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#[fg=#{@thm_fg},bg=#{@thm_bg}] #(tmux-ai-status) "
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# bring marked pane next to the current one
bind-key M-j join-pane -h

# bring the marked pane below the current one
bind-key M-J join-pane -v

# Set the command run in new windows/panes
set-option -g default-shell /bin/zsh
set-option -g default-command "/bin/zsh"

# We unbind the default first to be safe
unbind -T copy-mode M-w
bind-key -T copy-mode C-space send-keys -X begin-selection
bind-key -T copy-mode y send-keys -X copy-selection-and-cancel
#bind-key "K" display-popup  -w 40% "sesh connect \"$(sesh list -i | tv --ansi | awk '{print $NF}')\""
bind-key "K" display-popup -E  -w 40% "sesh connect \"$(sesh list -i | tv --ansi | awk '{print \$NF}')\""
